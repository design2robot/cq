<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="UR5 六轴机械臂三维仿真交互演示" />
    <meta name="theme-color" content="#f2f0e9" />
    <title>UR5 · 三维机械臂仿真</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="top">
      <section class="robot-lab" id="robot-lab" aria-labelledby="robot-lab-title">
        <div class="lab-heading">
          <div>
            <p class="overline">Interactive Research Demo · UR5 / 6 DOF</p>
            <h1 id="robot-lab-title">UR5 三维机械臂仿真</h1>
          </div>
          <div class="tcp-readout" aria-live="polite">
            <span>TCP POSITION / mm</span>
            <strong id="tcpPosition">X 000 · Y 000 · Z 000</strong>
          </div>
        </div>

        <div class="lab-layout">
          <div class="robot-stage">
            <div id="robotCanvas" class="robot-canvas" role="img" aria-label="可拖动视角的 UR5 六轴机械臂三维仿真">
              <div class="canvas-hud" aria-hidden="true">
                <span>UR5 / DH MODEL</span>
                <span>850 mm REACH · 5 kg PAYLOAD</span>
              </div>
              <p id="webglFallback" class="webgl-fallback" hidden>当前浏览器无法启动 3D 视图。</p>
            </div>
          </div>

          <div class="robot-controls">
            <div class="control-grid">
              <label>J1 · Base <output id="j1Value">-20°</output><input id="j1" type="range" min="-180" max="180" value="-20" /></label>
              <label>J2 · Shoulder <output id="j2Value">-70°</output><input id="j2" type="range" min="-180" max="180" value="-70" /></label>
              <label>J3 · Elbow <output id="j3Value">85°</output><input id="j3" type="range" min="-180" max="180" value="85" /></label>
              <label>J4 · Wrist 1 <output id="j4Value">-105°</output><input id="j4" type="range" min="-180" max="180" value="-105" /></label>
              <label>J5 · Wrist 2 <output id="j5Value">-90°</output><input id="j5" type="range" min="-180" max="180" value="-90" /></label>
              <label>J6 · Wrist 3 <output id="j6Value">15°</output><input id="j6" type="range" min="-180" max="180" value="15" /></label>
            </div>
            <div class="preset-controls">
              <button type="button" data-pose="home">Home</button>
              <button type="button" data-pose="reach">Reach</button>
              <button type="button" data-pose="print">Print</button>
              <button type="button" id="autoMotion" aria-pressed="false">Auto Motion</button>
            </div>
            <p class="lab-note">拖动视图旋转 / 缩放 · UR5 官方 DH 尺寸比例 · TCP 轨迹实时更新</p>
          </div>
        </div>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
